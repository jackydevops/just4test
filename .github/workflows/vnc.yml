name: ubuntu-vnc

on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      issues: write
    steps:
      - name: Install Ubuntu desktop (GNOME Flashback)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            ubuntu-desktop-minimal gnome-session-flashback \
            x11vnc novnc websockify dbus-x11 xvfb
          curl -sL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y -qq /tmp/chrome.deb

      - name: Start desktop + VNC + tunnel
        run: |
          Xvfb :1 -screen 0 1920x1080x24 &
          sleep 2
          x11vnc -display :1 -forever -nopw -rfbport 5901 -quiet &
          DISPLAY=:1 dbus-run-session -- gnome-session --session=gnome-flashback-metacity &
          websockify --web /usr/share/novnc 6080 localhost:5901 &
          curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6080 > tunnel.log 2>&1 &

      - name: Wait URL + keep alive
        run: |
          for i in $(seq 1 120); do
            URL=$(grep -o 'https://[a-z0-9.-]*\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "VNC: $URL/vnc.html"
          echo "::notice title=VNC::$URL/vnc.html"
          gh api repos/$GITHUB_REPOSITORY/issues/2/comments -f body="run $GITHUB_RUN_ID: $URL/vnc.html" >/dev/null
          while true; do sleep 60; done
        env:
          GH_TOKEN: ${{ github.token }}
